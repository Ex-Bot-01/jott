[package]
name = "jott-core"
version.workspace = true
edition.workspace = true
license.workspace = true
description = "Everything Jott does to files and to np — no GUI, no webview, testable headless."

[dependencies]
serde = { version = "1", features = ["derive"] }
serde_json = "1"
sha2 = "0.10"
thiserror = "2"
walkdir = "2"
tokio = { version = "1", features = ["rt-multi-thread", "macros", "process", "io-util", "sync", "time"] }
notify = "8.2.2"
trash = "5.3.0"
toml_edit = "0.25.19"


[dev-dependencies]
tempfile = "3"
