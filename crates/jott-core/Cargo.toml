[package]
name = "jott-core"
version.workspace = true
edition.workspace = true
license.workspace = true
description = "Everything Jott does to files and to np — no GUI, no webview, testable headless."

[dependencies]
serde = { version = "1", features = ["derive"] }
serde_json = "1"
thiserror = "2"

[dev-dependencies]
tempfile = "3"
