[package]
name = "jott-shell"
version = "0.0.28"
edition = "2021"
description = "The Jott window: a thin Tauri v2 shell over jott-core."

# Its own workspace on purpose: building this needs webkit2gtk/gtk headers that the
# headless core must never require. CI builds it on Windows and Linux runners.
[workspace]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
jott-core = { path = "../../crates/jott-core" }
serde_json = "1"
# `devtools`, because a release build without it has no console at all: wry defaults devtools to off outside debug
# builds (wry-0.57.2/src/lib.rs:873-875) and tauri only forwards its own setting under
# `cfg(any(debug_assertions, feature = "devtools"))` (tauri-runtime-wry-2.12.3/src/lib.rs:5146). Every instruction in
# `docs/testing-on-windows.md` that says "press Ctrl+Shift+I and paste this" was sending someone to a key that does
# nothing. Jott is a local program over somebody's own notes: a console costs nothing, and our whole way of finding
# out what happened depends on someone being able to look.
tauri = { version = "2", features = ["devtools"] }
tauri-plugin-dialog = "2"
tauri-plugin-notification = "2"
tauri-plugin-opener = "2"
# Remember the window size and position between runs. The plan asked for the window to come back to the
# folder it had; coming back to the shape it had is the other half of "it is where I left it".
tauri-plugin-window-state = "2"
# Only to name `broadcast`'s receive-error variants while forwarding trace rows; Tauri brings its own runtime.
tokio = { version = "1", features = ["sync"] }
