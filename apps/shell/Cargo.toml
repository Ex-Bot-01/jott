[package]
name = "jott-shell"
version = "0.0.3"
edition = "2021"
description = "The Jott window: a thin Tauri v2 shell over jott-core."

# Its own workspace on purpose: building this needs webkit2gtk/gtk headers that the
# headless core must never require. CI builds it on Windows and Linux runners.
[workspace]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
jott-core = { path = "../../crates/jott-core" }
serde_json = "1"
tauri = { version = "2", features = [] }
tauri-plugin-dialog = "2"
