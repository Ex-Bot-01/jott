name: build

on:
  push:
    tags: ["v*"]
  pull_request:
    paths-ignore: ["docs/**"]

jobs:
  # The suites run on Linux and on every pull request. They are a separate job because the app job is
  # about producing an artifact on two operating systems, and a red test should stop a release rather than
  # be visible only as a missing download.
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: { node-version: "22", cache: npm }
      - run: npm ci
      - name: front end
        run: |
          npm run test
          npm run build
          npx svelte-check --tsconfig ./tsconfig.app.json --output human
      - uses: dtolnay/rust-toolchain@stable
        with: { components: rustfmt, clippy }
      - name: core suites
        working-directory: crates/jott-core
        run: cargo test
      - name: clippy
        working-directory: crates/jott-core
        run: cargo clippy --all-targets -- -D warnings

  app:
    needs: test
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: windows-latest
            bundles: msi
            artifacts:
              - { path: apps/shell/target/release/bundle/msi/*.msi, name: jott-windows-x64.msi }
          - os: ubuntu-latest
            bundles: deb,appimage
            artifacts:
              - { path: apps/shell/target/release/bundle/deb/*.deb, name: jott-linux-x64.deb }
              - { path: apps/shell/target/release/bundle/appimage/*.AppImage, name: jott-linux-x64.AppImage }
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: { node-version: "22", cache: npm }
      - if: matrix.os == 'ubuntu-latest'
        run: |
          sudo apt-get update
          sudo apt-get install -y libwebkit2gtk-4.1-dev libgtk-3-dev librsvg2-dev patchelf
      - run: npm ci
      - run: npm run build
      - uses: dtolnay/rust-toolchain@stable
      # The artifacts ship without np by design (spec §2: Jott finds it or says how to install it), but a
      # release should still prove which backend the runner had in front of it, because "it worked" without
      # a version is not a fact anyone can use six weeks later.
      - name: backend under test
        shell: bash
        run: |
          echo "== np on this runner =="
          np --version || echo "np not on the runner; artifacts ship without it by design"
      # The installer carries np inside it (§5's lookup order), so a fresh install needs no second download
      # and no PATH lesson. Pinned version, verified hash — an installer that shipped a tampered or
      # half-fetched backend would index someone's notes with it.
      - name: fetch np to bundle (Windows)
        if: matrix.os == 'windows-latest'
        shell: pwsh
        run: ./scripts/fetch-np.ps1
      - name: fetch np to bundle (Linux)
        if: matrix.os == 'ubuntu-latest'
        run: ./scripts/fetch-np.sh
      # Run from the shell crate's own folder: it is its own workspace (its `target/` is where the bundles
      # land, which is what the upload paths below say), and from there the CLI finds `tauri.conf.json`
      # beside the manifest without being pointed at it.
      - name: bundle
        working-directory: apps/shell
        run: npx tauri build --bundles ${{ matrix.bundles }}
      # Named exactly, kept for 30 days, and uploaded here rather than by `tauri-action`: a hand-off link
      # that reads `2_jott-windows-x64_…msi` is a file someone has to rename before they can tell a
      # colleague which build they are running (§19).
      - name: upload
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: ${{ matrix.artifacts[0].name }}
          path: ${{ matrix.artifacts[0].path }}
          retention-days: 30
          if-no-files-found: error
      - name: upload (second bundle)
        if: matrix.os == 'ubuntu-latest' && always()
        uses: actions/upload-artifact@v4
        with:
          name: ${{ matrix.artifacts[1].name }}
          path: ${{ matrix.artifacts[1].path }}
          retention-days: 30
          if-no-files-found: error

  # A tag is the hand-off itself. Artifacts attached to a workflow run need a signed-in account and expire;
  # a release does neither, and §19's "send the tester a link" is worth one job that copies the same files
  # somewhere a person with no GitHub access to this repository can click.
  release:
    if: github.ref_type == 'tag'
    needs: app
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
      - uses: actions/download-artifact@v4
        with:
          pattern: "jott-*"
          path: built
      # One folder, one checksum list: a tester should be able to ask "is this the file CI built" without
      # trusting the transport it came through.
      - name: collect and checksum
        run: |
          mkdir -p out
          #
          # The rename is the point of this step. `upload-artifact`'s `name` labels the artifact, not the
          # file inside it, so what came down was `Jott_0.0.3_x64_en-US.msi` inside a folder called
          # `jott-windows-x64.msi`. The folder name is the name §19 asked for, so each artifact's single file
          # is moved onto it — and an artifact holding anything other than one bundle fails here instead of
          # losing one quietly.
          for dir in built/*/; do
            name=$(basename "$dir")
            count=$(find "$dir" -type f | wc -l)
            [ "$count" -eq 1 ] || { echo "$name holds $count files, expected one bundle"; exit 1; }
            mv "$(find "$dir" -type f)" "out/$name"
          done
          # AppImage is the one asset a person runs in place, and a download does not keep the mode bit.
          for file in out/*.AppImage; do [ -f "$file" ] && chmod +x "$file"; done
          for wanted in jott-windows-x64.msi jott-linux-x64.deb jott-linux-x64.AppImage; do
            test -s "out/$wanted" || { echo "no $wanted was produced"; exit 1; }
          done
          (cd out && sha256sum * > SHA256SUMS.txt)
          ls -l out; cat out/SHA256SUMS.txt
      - name: publish the release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          gh release create "$GITHUB_REF_NAME" \
            --title "Jott $GITHUB_REF_NAME" \
            --notes-file docs/release-notes.md \
            out/*
