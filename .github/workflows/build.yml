name: build

on:
  push:
    tags: ["v*"]
  pull_request:
    paths-ignore: ["docs/**"]

jobs:
  app:
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: windows-latest
            artifact: jott-windows-x64
          - os: ubuntu-latest
            artifact: jott-linux-x64
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: { node-version: "22", cache: npm }
      - if: matrix.os == 'ubuntu-latest'
        run: |
          sudo apt-get update
          sudo apt-get install -y libwebkit2gtk-4.1-dev libgtk-3-dev librsvg2-dev patchelf
      - run: npm ci
      - run: npm run build
      - uses: dtolnay/rust-toolchain@stable
      - name: backend under test
        run: np --version || echo "np not on the runner; artifacts ship without it by design"
      - uses: tauri-apps/tauri-action@v0
        with:
          projectPath: apps/shell
          artifactName: ${{ matrix.artifact }}
