<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <link rel="icon" type="image/svg+xml" href="/favicon.svg" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Jott</title>
    <style>
      /* Painted from HTML alone, before any script runs: the window appears with the shape of the app in it
         rather than a blank page while the bundle loads. If the scripts never run at all — which is what a
         white window means — this stays on screen and says so, instead of showing nothing to screenshot. */
      /* The same two colours as `src/app.css`, repeated on purpose: this paints first, and a skeleton in the
         wrong palette is a colour flip the moment the app appears. */
      :root {
        color-scheme: light dark;
        --paper: #fafaf9;
        --ink: #23211f;
      }
      @media (prefers-color-scheme: dark) {
        :root {
          --paper: #1b1a19;
          --ink: #eae7e3;
        }
      }
      html,
      body {
        margin: 0;
        height: 100%;
        background: var(--paper);
        color: var(--ink);
      }
      #boot {
        position: fixed;
        inset: 0;
        display: grid;
        grid-template-columns: minmax(14rem, 22rem) 1fr;
        grid-template-rows: 1fr auto;
        font: 14px/1.5 system-ui, "Segoe UI", sans-serif;
      }
      #boot .side {
        border-right: 1px solid color-mix(in srgb, currentColor 25%, transparent);
        padding: 0.6rem;
      }
      #boot .bar {
        height: 0.7rem;
        margin: 0 0 0.55rem;
        border-radius: 3px;
        background: color-mix(in srgb, currentColor 14%, transparent);
      }
      #boot .bar.short {
        width: 45%;
      }
      #boot .status {
        grid-column: 1 / -1;
        border-top: 1px solid color-mix(in srgb, currentColor 25%, transparent);
        padding: 0.3rem 0.6rem;
        font-size: 0.8rem;
        color: color-mix(in srgb, currentColor 65%, transparent);
      }
      #boot .wait {
        grid-column: 2;
        align-self: center;
        justify-self: center;
        color: color-mix(in srgb, currentColor 65%, transparent);
      }
    </style>
  </head>
  <body>
    <div id="app"></div>
    <div id="boot" aria-hidden="true">
      <div class="side">
        <div class="bar short"></div>
        <div class="bar"></div>
        <div class="bar"></div>
        <div class="bar short"></div>
      </div>
      <div></div>
      <div class="status">Jott is starting…</div>
    </div>
    <script type="module" src="/src/main.ts"></script>
  </body>
</html>
